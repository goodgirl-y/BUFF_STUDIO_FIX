html,body{height:100%;margin:0;background:var(--ink)}
body{background:var(--ink);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lg{display:inline-block;aspect-ratio:1717/1592;background:var(--ink);-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat}
.spin{animation:sp 2.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:9s}}
#app{position:fixed;inset:0;background:var(--sky);padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}#boot,#desk{position:relative;height:100%}
#desk{display:none}
#boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#boot h1{font-size:46px;letter-spacing:-2px;margin:0}#boot p{margin:0;font-size:16px}
.wm{position:absolute;right:5%;bottom:96px;width:min(44vw,420px);background:#afd5e9;pointer-events:none}
#ic{position:absolute;left:24px;top:24px;display:grid;gap:22px}
.i{width:108px;text-align:center;font-size:14px;font-weight:700;cursor:pointer}
.i div{width:76px;height:76px;margin:0 auto 8px;background:#fff;border:2px solid var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center}
#tb{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:999;font-size:14px}
.br{display:flex;align-items:center;gap:10px;font-weight:700}
#g{display:flex;align-items:center;gap:12px}
.bar{height:10px;background:var(--soft);border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
#g .bar{width:220px;background:#2a2726;border-color:#7a7574}#g .bar i{background:var(--sky)}
.w{position:absolute;display:flex;flex-direction:column;width:min(580px,92vw);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 rgba(62,58,57,.2);overflow:hidden}
.t{flex:none;background:var(--ink);color:#fff;padding:6px 8px 6px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;touch-action:none}
.x{width:38px;height:38px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.b{padding:24px 30px 30px;background:#fff;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.b .bar{margin-bottom:26px}
.q{font-size:22px;font-weight:700;line-height:1.5;margin:0 0 24px}
.o{display:block;width:100%;text-align:left;margin:0;padding:16px 18px;min-height:54px;font:inherit;font-size:17px;line-height:1.4;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px}
.o+.o{margin-top:12px}.o:active{background:var(--sky)}
.row{display:flex;gap:12px;margin-top:24px}.row .o{text-align:center}.row .o+.o{margin-top:0}
.b p{line-height:1.65;margin:0 0 16px}
.sys{font-size:14px;margin:0 0 10px!important}
.name{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.25;margin:0 0 16px}
.chips{margin-bottom:20px!important}.chips span{display:inline-block;margin:0 8px 8px 0;padding:7px 12px;border:2px solid var(--ink);border-radius:99px;font-size:14px;font-weight:700}
.box{padding:16px 18px;border:2px solid var(--ink);border-radius:8px;line-height:1.65;margin-bottom:14px}
.box b{display:block;margin-bottom:6px}.cheer{background:var(--sky);border-color:var(--sky)}
.note{font-size:13px;opacity:.7;margin:6px 0 0!important}
.st{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);line-height:1.5}.st b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px 0 10px}
.c p{margin:0}.big{font-size:20px;font-weight:800;line-height:1.5}
.gm{display:flex;justify-content:space-between;font-size:15px;margin-bottom:12px}
.gs{height:150px;border:2px solid var(--ink);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-weight:800;font-size:20px;line-height:1.5;margin-bottom:20px;background:#fff}
.gs.warn{background:var(--sky);animation:bl .5s steps(2) infinite}@keyframes bl{50%{background:#fff}}
.gs.boss{background-color:var(--ink);color:#fff;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.2) 23px 24px),repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.2) 79px 80px)}
.hb{width:100%;padding:28px 16px;font:inherit;font-size:20px;font-weight:800;border:2px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;touch-action:none;-webkit-touch-callout:none}.hb.on{background:var(--sky);color:var(--ink)}
.ti{display:block;width:100%;box-sizing:border-box;margin:0 0 16px;padding:14px 16px;font:inherit;font-size:20px;font-weight:500;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;pointer-events:none;outline:0}
.cv{display:block;width:100%;border:2px solid var(--ink);border-radius:8px;background:#eaf6fb;touch-action:none}

:root{--sk:"Silkscreen",-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;--p8:"Press Start 2P","Silkscreen",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{background:var(--sky) repeating-conic-gradient(#bbdcee 0 25%,transparent 0 50%) 0 0/4px 4px;image-rendering:pixelated}
.w{border-radius:2px;box-shadow:4px 4px 0 #fff,6px 6px 0 var(--ink),10px 10px 0 #fff,12px 12px 0 var(--ink)}
.t{position:relative;justify-content:center;min-height:44px;box-sizing:border-box;padding:6px 56px;color:var(--ink);border-bottom:2px solid var(--ink);background:repeating-linear-gradient(0deg,#fff 0 3px,var(--ink) 3px 4px)}
.t span{background:#fff;padding:2px 14px;font-family:var(--sk);font-size:14px;font-weight:700;letter-spacing:.5px}
.x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;background:#fff;border:2px solid var(--ink);color:var(--ink)}
.o,.hb{border-radius:0;box-shadow:3px 3px 0 var(--ink)}
.o:active,.hb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.box,.gs,.ti,.cv,.chips span{border-radius:0}
.bar{height:14px;border:2px solid var(--ink);background:#fff}
.bar i{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 8px)}
#g .bar{background:#2a2726;border-color:#8a8583}#g .bar i{background:repeating-linear-gradient(90deg,var(--sky) 0 6px,transparent 6px 8px)}
#tb{font-family:var(--sk);font-size:15px;border-top:2px solid #fff}
.i{width:112px;font-size:13px}.i div{width:72px;height:72px;background:none;border:0;border-radius:0;margin:0 auto 6px}
.i span{display:inline-block;background:#fff;padding:2px 6px;font-family:var(--sk);font-weight:700;line-height:1.35}
.i:active span{background:var(--ink);color:#fff}
#boot h1{font-family:var(--p8);font-size:34px;letter-spacing:0;font-weight:400}#boot p{font-family:var(--sk);font-size:16px}
